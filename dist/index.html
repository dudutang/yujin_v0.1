<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>余烬 出征原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  /* 一个视觉世界：灰潮冷灰蓝 + 人的琥珀光 + 研究所青白。单主题，深色。 */
  --ash-0:#0e1118;
  --ash-1:#171b24;
  --ash-2:#2b3340;
  --ash-3:#6a7487;
  --bone:#e8e2d4;
  --amber:#ffb454;
  --cyan:#9fe8ff;
  --tide:#a99cc9;
  --danger:#ff5a4f;
  --elec:#bfe6ff;
  --font-display:'Silkscreen','PingFang SC','Microsoft YaHei',monospace;
  --font-body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  /* 布局：画布铺满；HUD 钉在四角；选择与结算是居中的面板 */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ash-0);color:var(--bone);font-family:var(--font-body);overflow:hidden}
#game{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;font-size:13px}
#hud[hidden]{display:none}
.top{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(520px,56vw);display:grid;gap:5px}
.bar{position:relative;height:15px;background:rgba(14,17,24,.8);border:1px solid var(--ash-2);border-radius:3px;overflow:hidden}
.bar .fill{position:absolute;inset:0;transform-origin:left center}
.bar.tide{height:24px}
.bar.boss{height:18px;margin-top:6px;border-color:#b79cff}.bar.boss .fill{background:linear-gradient(90deg,#4b3f66,#b79cff)}.bar.boss span{font-size:11px}.bar.boss i{font-style:normal;margin-left:8px;color:#dfe3ea}
.bar.tide .fill{background:linear-gradient(90deg,#3a4152,#7d6fa8 70%,#c47a9a)}
.bar.tide .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(232,226,212,.35)}
.bar.tide.flood{border-color:var(--danger)}
.bar.tide.flood .fill{background:linear-gradient(90deg,#7a1f1a,var(--danger));animation:blink .7s steps(2) infinite}
.bar.tide span b#cStage{letter-spacing:.06em}
.bar.conc .fill{background:linear-gradient(90deg,#363c4c,var(--tide))}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar span b{font-family:var(--font-display);font-weight:400;letter-spacing:.03em}
@keyframes blink{50%{opacity:.55}}

.tl{position:absolute;top:12px;left:12px;width:210px;display:grid;gap:5px}
.tl .row{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.tl .lv{font-family:var(--font-display);font-size:16px;color:var(--amber)}
.tl .time{font-family:var(--font-display);font-size:14px}
.bar.hp .fill{background:linear-gradient(90deg,#8a2b2b,#e0574f)}
.bar.hp.breath .fill{background:linear-gradient(90deg,#8a2b2b,#e0574f 70%,#9be08a)}
.bar.hp.breath{box-shadow:0 0 8px rgba(155,224,138,.45)}
.bar.ovl{height:13px}.bar.ovl span{font-size:10px}
.bar.ovl .fill{background:#2f5f9e}
.bar.ovl.hot .fill{background:#4f8fe0}
.bar.ovl.rage .fill{background:#8e2b26}
.bar.ovl.rage.hot .fill{background:#e0574f}

.build{position:absolute;left:12px;top:118px;width:210px;display:grid;gap:10px}
.build h4{margin:0;font-size:11px;font-weight:400;color:var(--ash-3);letter-spacing:.12em}
.slots{display:grid;gap:3px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 8px;background:rgba(14,17,24,.78);border:1px solid var(--ash-2);border-left:3px solid var(--ash-3);border-radius:3px;font-size:12px;min-height:24px}
.slot.skill{border-left-color:#7fb8ff}
.slot.passive{border-left-color:var(--amber)}
.slot.bless{border-left-color:var(--tide)}
.slot.ign{border-left-color:#fff;background:rgba(60,90,130,.45)}
.slot.empty{color:var(--ash-3);border-style:dashed;border-left-width:1px}
.slot .meta{font-family:var(--font-display);font-size:10px;color:var(--ash-3);white-space:nowrap}
.slot .meta b{color:var(--bone);font-weight:400}

.tr{position:absolute;top:12px;right:12px;display:grid;gap:4px;justify-items:end}
#mini{width:220px;height:140px;border:1px solid var(--ash-2);border-radius:3px;background:rgba(14,17,24,.8)}
.tr .legend{font-size:11px;color:var(--ash-3)}

.bl{position:absolute;left:12px;bottom:22px;display:flex;gap:14px;align-items:baseline;padding:6px 10px;background:rgba(14,17,24,.78);border:1px solid var(--ash-2);border-radius:3px;font-variant-numeric:tabular-nums}
.bl .k{color:var(--ash-3);font-size:11px}
.bl .v{font-family:var(--font-display);font-size:14px}
.bl.rot .v{color:var(--danger)}
.br{position:absolute;right:12px;bottom:22px;font-size:11px;color:var(--ash-3);text-align:right;line-height:1.6}
.xp{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(14,17,24,.9)}
.xp .fill{position:absolute;inset:0;background:var(--amber);transform-origin:left center}
#prompt{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);padding:6px 14px;border-radius:3px;background:rgba(14,17,24,.85);border:1px solid var(--ash-2);font-size:14px;white-space:nowrap}
#prompt:empty{display:none}
#prompt.warn{border-color:var(--danger);color:#ffb3ad}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#banner.on{opacity:1}
#banner .b1{font-size:30px;font-weight:700;letter-spacing:.08em;text-shadow:0 0 18px currentColor}
#banner .b2{font-size:14px;color:var(--bone);opacity:.85;margin-top:4px}

/* overlays */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(9,11,16,.78);padding:16px;overflow:auto}
#overlay.on{display:flex}
.panel{width:min(980px,100%);display:grid;gap:16px;margin:auto}
.panel h2{margin:0;font-size:22px;text-wrap:balance}
.panel .sub{color:var(--ash-3);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{cursor:pointer;text-align:left;background:var(--ash-1);border:1px solid var(--ash-2);border-top:3px solid var(--r,#9aa3b5);border-radius:6px;padding:14px;display:grid;gap:8px;align-content:start}
.card:hover{border-color:var(--ash-3);border-top-color:var(--r,#9aa3b5);background:#1c212c}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .name{font-size:17px;font-weight:700}
.card .key{font-family:var(--font-display);font-size:11px;color:var(--ash-3)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--ash-2);color:#c9cfdb}
.chip.slot-c{background:#2d3a2e;color:#b9e3b4}
.chip.slot-m{background:#26344a;color:#b6d4ff}
.chip.slot-t{background:#3d2c3f;color:#e6bde9}
.chip.slot-k{background:#16392f;color:#7ff0c8}
.chip.rar1{background:#1f3550;color:#9fd0ff}
.chip.r0{background:#2a2f3a;color:#c3c9d6}.chip.r1{background:#1f3a2a;color:#8fe6a6}.chip.r2{background:#1f3550;color:#9fd0ff}.chip.r3{background:#4a3416;color:var(--amber);font-weight:700}
.card.on{outline:2px solid var(--amber);background:#2a2618}
.card.reveal{opacity:0;transform:translateY(14px) scale(.96);animation:rv .45s ease-out forwards}@keyframes rv{to{opacity:1;transform:none}}
.afxbox{display:grid;gap:4px;background:rgba(0,0,0,.22);border-radius:4px;padding:8px 10px}
.afx{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#cfd6e4}.afx b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}.afx b i{color:var(--amber);font-style:normal;margin:0 2px}
.afx.base{font-size:12px;color:#b9c0cf;display:block}.afx.now2{font-size:12px;color:var(--ash-3);display:block}.afx.now2 b{color:#aab1bf;font-weight:400;margin-left:6px}
.pool{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;margin-top:2px}.pool .pl{color:var(--ash-3);margin-right:2px}
.stt{width:100%;border-collapse:collapse;font-size:13px}.stt td{padding:3px 0}.stt td.v{text-align:right;font-variant-numeric:tabular-nums;color:#d4d0c6}.stt td.v.up{color:var(--amber);font-weight:600}.stt tr.src td{font-size:11px;color:#c9a96a;padding:0 0 4px}.stt tr.ex td{font-size:11px;color:#9aa3b5;padding:0 0 2px}
.pk{padding:1px 6px;border-radius:3px;background:#262b36;color:#8f97a8}.pk.on{background:#3a3220;color:var(--amber)}.pk.g{background:#20303a;color:#9fd0ff}
.chip.rar2{background:#4a3416;color:var(--amber)}
.chip.need{background:#fff;color:#111;font-weight:700}
.chip.r4{background:#4a3a06;color:#ffd700}
.gears{display:flex;flex-wrap:wrap;gap:8px}.gear{border:1px solid var(--r);border-left:4px solid var(--r);border-radius:6px;padding:8px 10px;flex:1 1 240px;background:rgba(20,24,32,.6)}.gear.empty{border-color:#2a2f3a;border-left-color:#2a2f3a}.ga{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.gear .row-btns{margin-top:4px}
.godhead{display:flex;flex-direction:row;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--g);border-left:4px solid var(--g);border-radius:6px;background:rgba(20,24,32,.7);margin:6px 0 10px}
.godimg{width:72px;height:72px;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 10px var(--g))}.godtext{display:flex;flex-direction:column;gap:4px}.godsig{display:flex;gap:10px;align-items:baseline}.godname{font-size:18px;font-weight:700;color:var(--g)}.godwho{color:#8b93a3;font-size:12px}.godline{color:#d7dbe6;font-style:italic}.godstate{color:#8b93a3;font-size:12px}.godstate b{font-weight:700}
.chip.tagm{outline:1px solid #7fb8ff}
.card .lvl{font-family:var(--font-display);font-size:12px;color:var(--amber)}
.card p{margin:0;font-size:13px;line-height:1.55;color:#d4d0c6}
.card .now{color:var(--ash-3);font-size:12px}
.hint{font-size:12px;color:var(--ash-3)}
.btn{pointer-events:auto;cursor:pointer;padding:9px 18px;border-radius:4px;border:1px solid var(--amber);background:var(--amber);color:#1a1206;font-weight:700}
.btn.ghost{background:transparent;color:var(--bone);border-color:var(--ash-3)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.title{font-family:var(--font-display);font-size:13px;letter-spacing:.2em;color:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.box{background:var(--ash-1);border:1px solid var(--ash-2);border-radius:6px;padding:14px;display:grid;gap:8px;align-content:start}
.box h3{margin:0;font-size:14px;color:var(--ash-3);font-weight:400;letter-spacing:.08em}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;line-height:1.5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--ash-3)}
.kv dd{margin:0}
.big{font-size:28px;font-weight:700}
.ok{color:#9be29b}.bad{color:#ff8a80}
table.hist{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{padding:4px 6px;border-bottom:1px solid var(--ash-2);text-align:left;white-space:nowrap}
table.hist th{color:var(--ash-3);font-weight:400}
.tablewrap{overflow-x:auto}
textarea#dump{width:100%;height:120px;background:var(--ash-0);color:var(--bone);border:1px solid var(--ash-2);border-radius:4px;font-family:monospace;font-size:11px}
.techs{display:grid;gap:6px}.tech{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--ash-2);border-radius:4px;font-size:13px}.tech.own{border-color:#3d5a3d}.tech .btn{padding:6px 10px;font-size:12px;white-space:nowrap}.btn:disabled{opacity:.45;cursor:default}.tapes{max-height:300px;overflow:auto}
kbd{font-family:var(--font-display);font-size:11px;padding:1px 5px;border:1px solid var(--ash-3);border-radius:3px}
@media (prefers-reduced-motion:reduce){.bar.tide.flood .fill{animation:none}#banner{transition:none}}
@media (max-width:760px){.build{display:none}#mini{width:160px;height:102px}}
</style>
</head>
<body>
<canvas id="game" aria-label="出征画面"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="bar tide" id="cBar"><div class="fill" id="cFill"></div><i class="tick" style="left:30%"></i><i class="tick" style="left:60%"></i><i class="tick" style="left:85%"></i><span><b id="cStage">灰潮 · 薄雾</b><b id="cText">0</b></span></div>
    <div class="hint" id="cHint" style="text-align:center;font-size:11px;text-shadow:0 1px 0 #000"></div>
    <div class="bar boss" id="bBar" hidden><div class="fill" id="bFill"></div><span><b id="bName">蚀壳巨兽</b><i id="bText"></i></span></div>
  </div>
  <div class="tl">
    <div class="row"><span class="lv" id="lvText">LV 1</span><span class="time" id="tText">0:00</span></div>
    <div class="bar hp"><div class="fill" id="hFill"></div><span>生命<b id="hText">100</b></span></div>
    <div class="bar ovl" id="oBar"><div class="fill" id="oFill"></div><span id="oText">过载 · 满 100 自动脉冲</span></div>
  </div>
  <div class="build" id="build"></div>
  <div class="tr">
    <canvas id="mini" width="440" height="280" aria-label="小地图"></canvas>
    <div class="legend" id="layerText">外围</div>
  </div>
  <div class="bl" id="pack"><span class="k">背包</span><span class="k">废料</span><span class="v" id="scrapText">0</span><span class="k">零件</span><span class="v" id="partText">0</span><span class="k">击杀</span><span class="v" id="killText">0</span></div>
  <div class="br">WASD 移动 · 按住 <kbd>E</kbd> 交互 · <kbd>Esc</kbd> 暂停查看构筑 · <kbd>M</kbd> 声音</div>
  <div class="xp"><div class="fill" id="xFill"></div></div>
  <div id="prompt"></div>
  <div id="banner"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>
</div>

<div id="overlay" role="dialog" aria-modal="true"></div>

<script>
(() => {
'use strict';
// ================= 基础 =================
const M = 32;                       // 1 米 = 32 px
const CH = 24 * M; // 区块边长：世界无限，按需生成    // 地图：无限，按区块生成
const $ = s => document.querySelector(s);
const cv = $('#game'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d'), lm = document.createElement('canvas'), lctx = lm.getContext('2d'), lm2 = document.createElement('canvas'), lctx2 = lm2.getContext('2d');
let DPR = 1, ZOOM = 1, VW = 0, VH = 0, SW = 0, SH = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = innerWidth; SH = innerHeight;
  cv.width = SW * DPR; cv.height = SH * DPR;
  cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
  ZOOM = Math.max(0.6, Math.min(1.5, Math.min(SW / 1200, SH / 720)));
  VW = SW / ZOOM; VH = SH / ZOOM;
  dark.width = Math.ceil(SW / 2); dark.height = Math.ceil(SH / 2); lm.width = lm2.width = dark.width; lm.height = lm2.height = dark.height;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const d2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
const pickU = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pickW(a, wf) { let s = 0; const w = a.map(x => { const v = wf(x); s += v; return v; }); let r = Math.random() * s; for (let i = 0; i < a.length; i++) { r -= w[i]; if (r <= 0) return a[i]; } return a[a.length - 1]; }
const fmt = s => { s = Math.max(0, Math.floor(s)); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
const median = a => { if (!a.length) return 0; const b = a.slice().sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };

// ================= 数据：职业技能（弧光师） =================
const scale = l => 1 + 0.25 * (l - 1);
const SKILLS = {
  torch: { name: '弧光焊枪', tags: ['电', '链式'], ignite: 'conductor', form: '弧光网',
    base: '周期性向最近的敌人放一道电弧', stat: () => stSummary('torch'),
    A: ['链式', '电弧额外跳向 2 个敌人（每跳 70% 伤害）'], B: ['聚焦', '单体伤害 ×2.5，命中麻痹 0.5 秒'],
    formText: '所有感电敌人之间周期性连起电弧' },
  coil: { name: '电容线圈', tags: ['电', '召唤物', '区域'], ignite: 'amplify', form: '电环',
    base: '线圈绕身旋转，接触放电', stat: () => stSummary('coil'),
    A: ['扩圈', '旋转半径 +50%'], B: ['增数', '线圈 +2 个'], formText: '线圈之间连成电环，持续电击环上的敌人' },
  ground: { name: '接地', tags: ['电', '区域', '眩晕', '击退'], ignite: 'heavy', form: '地脉',
    base: '周期性以自身为中心震击，眩晕并击退', stat: () => stSummary('ground'),
    A: ['余震', '0.4 秒后再震一次（60% 伤害）'], B: ['导体地面', '留下 3 秒带电地面'], formText: '震击范围翻倍，每次都留下 8 秒带电地面' },
  rod: { name: '避雷针', tags: ['电', '召唤物', '区域'], ignite: 'magnet', form: '针阵',
    base: '周期性在敌群里插针，嘲讽 4 米内敌人并持续放电', stat: () => stSummary('rod'),
    A: ['多根', '一次插 2 根'], B: ['连线', '针与你之间连一道伤人的电弧'], formText: '针持续 10 秒，所有针之间连成电网' },
  short: { name: '短路', tags: ['电', '受伤触发'], ignite: 'tough', form: '永动',
    base: '受伤时向周围放电弧（有冷却）', stat: () => stSummary('short'),
    A: ['反弹', '电弧额外附加受到伤害的 300%'], B: ['护盾', '受伤后获得 2 秒护盾（吸收 15）'], formText: '不需要受伤，每秒自动放电' },
  tune: { name: '过载调谐', tags: ['电', '过载'], ignite: 'capacitor', form: '蓄能脉冲',
    base: '过载积累更快，过载脉冲更强', stat: () => stSummary('tune'),
    A: ['余热', '脉冲后 3 秒光圈伤害翻倍'], B: ['稳压', '过载到 50 时先放一次半脉冲'], formText: '脉冲范围 +30%，并在 0.35 秒后补一次 50% 的余波' },
};
// ================= 数据：通用被动 =================
const PASSIVES = {

    if (S.netT <= 0) { S.netT = 0.3; for (let i = 0; i < pins.length; i++) for (let j = i + 1; j < pins.length; j++) { const a = pins[i], b = pins[j]; segHit(a.x, a.y, b.x, b.y, 0.5 * M, stv('rod', 'dmg') * 0.85); addArc(a.x, a.y - 14, b.x, b.y - 14, '#ffffff', 0.3, 1.6); } }
  }
  pins = pins.filter(pn => pn.t > 0);
  // 带电地面
  for (const z of zones) { z.t -= dt; z.tick -= dt; if (z.tick <= 0) { z.tick = 0.5; for (const e of query(z.x, z.y, z.r)) { if (z.kind) e.inCrack = S.t + 0.6; if (z.elem === 'time') e.slowZ = S.t + 0.6; dealDamage(e, z.dmg, z.elem || (z.kind ? 'phys' : 'elec'), { weak: true, sc: z.elem === 'frost' ? 0.3 : z.elem === 'fire' ? 0.3 : undefined }); } } }
  zones = zones.filter(z => z.t > 0);
  // 职业特性：光圈电伤 + 过载（弧光师）
  if (isW()) return;
  S.lightTickT -= dt * D.aspd;
  if (S.lightTickT <= 0) { S.lightTickT = 0.5; const m = p.afterHeatT > 0 ? 2 : 1; lampTick(m); }
  p.overload = Math.max(0, p.overload - 3 * dt);
  const tune = skillOf('tune');
  if (tune && tune.branch === 'B' && p.overload >= 50 && !p.halfFired) { p.halfFired = true; pulse(0.5); }
  if (p.overload >= 100) { p.overload = 0; p.halfFired = false; pulse(1); }
}

}
